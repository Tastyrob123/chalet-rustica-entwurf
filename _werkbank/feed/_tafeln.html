*{box-sizing:border-box;margin:0;padding:0}
body{background:#333333}
.k{position:relative;width:1080px;height:1350px;overflow:hidden;margin:0 0 20px;font-family:'B',Georgia,serif}
.k--t,.k--e{background:#4a3926 url(../assets/zeichen/tapete-dunkel.svg) 50% 50%/360px auto;color:#f4eee3}
.k--a{background:#f4eee3;color:#4a3926}
/* das Raster zeigt 3:4, also 34 px weniger je Seite: der Rahmen hält Abstand */
.k i.r{position:absolute;inset:86px 96px;border:1.5px solid rgba(217,191,143,.62)}
.k--a i.r{border-color:rgba(135,112,70,.6)}
.k .ce{position:absolute;left:0;right:0;top:170px;display:flex;justify-content:center}
.k .satz{position:absolute;left:120px;right:120px;top:50%;transform:translateY(-46%);text-align:center;font-size:112px;line-height:1.14;letter-spacing:-.005em}
.k .satz b{font-weight:400;color:#d9bf8f;display:block}
.k .satz span{display:block}
.k .lin{position:absolute;left:50%;bottom:262px;width:110px;height:2px;margin-left:-55px;background:#d9bf8f}
.k .kl{position:absolute;left:120px;right:120px;bottom:186px;text-align:center;font-family:'M',monospace;font-size:23px;letter-spacing:.2em;text-transform:uppercase;color:#d9bf8f}
.k--a .kl{color:#877046}.k--a .lin{background:#a58447}
.k--a .name{position:absolute;left:0;right:0;top:268px;text-align:center;font-size:92px;line-height:1.1}
.k--a .bild{position:absolute;left:138px;right:138px;top:424px;height:640px;display:flex;align-items:center;justify-content:center}
.k--a .bild img{width:100%;height:100%;object-fit:cover;object-position:var(--op,50% 50%);display:block;border:1.5px solid rgba(74,57,38,.5);padding:12px;background:#faf6ee}
.k--a .lin{bottom:236px}.k--a .kl{bottom:164px}.k--a .ce{top:150px}
.k--a .bild svg{height:100%;width:auto}
.k--e .et{position:absolute;left:50%;top:50%;width:700px;transform:translate(-50%,-50%) rotate(-5deg)}
.k--e .et img{width:100%;display:block;filter:drop-shadow(0 30px 34px rgba(0,0,0,.5))}
.k--t.hell{background:#f4eee3;color:#4a3926}
.k--t.hell i.r{border-color:rgba(135,112,70,.6)}.k--t.hell .satz b{color:#877046}.k--t.hell .kl{color:#877046}.k--t.hell .lin{background:#a58447}

.k--k{background:#f4eee3;color:#4a3926}
.k--k i.r{border-color:rgba(135,112,70,.6)}
.k--k i.r::after{content:'';position:absolute;inset:10px;border:1px solid rgba(135,112,70,.35)}
.k--k .ce{top:158px}
.k--k .mit{position:absolute;left:150px;right:150px;top:330px;bottom:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.k--k .name{font-size:104px;line-height:1.08}
.k--k .name span{display:block}
.k--k .zl{margin-top:44px;font-family:'S',Arial,sans-serif;font-size:45px;line-height:1.42;color:rgba(74,57,38,.8);max-width:660px}
.k--k .pr{position:absolute;left:150px;right:150px;bottom:236px;display:flex;align-items:baseline;gap:16px;font-size:62px}
.k--k .pr i{flex:1;border-bottom:3px dotted rgba(74,57,38,.4);transform:translateY(-10px)}
.k--k .pr small{font-family:'M',monospace;font-size:23px;letter-spacing:.2em;text-transform:uppercase;color:#877046}
.k--k .kl{position:absolute;left:120px;right:120px;bottom:160px;text-align:center;font-family:'M',monospace;font-size:21px;letter-spacing:.2em;text-transform:uppercase;color:#877046}
